# Google Cloud Build configuration for VividPlate
# Deploy to Cloud Run with a single command:
#   gcloud builds submit --config cloudbuild.yaml --project vividplate-503310
#
# IMPORTANT: Before first deploy, store secrets in Secret Manager:
#   gcloud secrets create DATABASE_URL --data-file=- <<< "postgresql://..."
#   gcloud secrets create SESSION_SECRET --data-file=- <<< "your-secret"
#   gcloud secrets create LEMONSQUEEZY_API_KEY --data-file=- <<< "eyJ..."
#   gcloud secrets create LEMONSQUEEZY_WEBHOOK_SECRET --data-file=- <<< "..."
#
# Grant Cloud Run SA access:
#   PROJECT_NUMBER=$(gcloud projects describe vividplate-503310 --format='value(projectNumber)')
#   gcloud secrets add-iam-policy-binding DATABASE_URL \
#     --member="serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
#     --role="roles/secretmanager.secretAccessor"
#   (repeat for each secret)

substitutions:
  _SERVICE_NAME: vividplate
  _REGION: us-central1

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${BUILD_ID}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}'

  # Deploy container image to Cloud Run with secrets from Secret Manager
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--cpu-boost'
      # Non-secret environment variables
      - '--set-env-vars'
      - >-
        NODE_ENV=production,
        CHAPA_ENABLED=false,
        TELEGRAM_BOT_TOKEN=false,
        LEMONSQUEEZY_STORE_ID=338030,
        LEMONSQUEEZY_MONTHLY_VARIANT_ID=1713315,
        LEMONSQUEEZY_YEARLY_VARIANT_ID=1713296,
        LEMONSQUEEZY_WEBSITE_ADDON_VARIANT_ID=1732293
      # Secrets from Secret Manager (format: ENV_VAR=secret-name:version)
      - '--set-secrets'
      - >-
        DATABASE_URL=DATABASE_URL:latest,
        SESSION_SECRET=SESSION_SECRET:latest,
        LEMONSQUEEZY_API_KEY=LEMONSQUEEZY_API_KEY:latest,
        LEMONSQUEEZY_WEBHOOK_SECRET=LEMONSQUEEZY_WEBHOOK_SECRET:latest

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${BUILD_ID}'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY
